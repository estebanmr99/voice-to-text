[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spanglish-dictation"
version = "0.1.0"
description = "Windows-first, fully offline desktop voice-to-text for technical Spanglish"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Spanglish Dictation Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PySide6>=6.5",
    "sounddevice>=0.5",
    "numpy>=1.24",
    "pywhispercpp>=1.4",
    "pywin32==306",
]

[project.optional-dependencies]
vad = ["webrtcvad-wheels==2.0.11", "setuptools<67"]  # requires Visual C++ Build Tools on Windows; setuptools<67 needed for pkg_resources
release = ["pyinstaller>=6.0", "cyclonedx-bom>=5.0"]
dev = [
    "pytest>=8.0",
    "black",
    "ruff",
    "mypy",
    "jiwer>=3.0",
]

[project.scripts]
spanglish-dictation = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
